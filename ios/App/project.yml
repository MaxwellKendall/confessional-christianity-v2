name: ConfessionalChristianity
options:
  bundleIdPrefix: com.confessionalchristianity
  deploymentTarget:
    iOS: "17.0"
packages:
  DomainKit:
    path: ../DomainKit
  # Accounts (TKL-812): auth now, PostgREST sync later. Talks to the website's
  # Supabase project directly under RLS.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
targets:
  ConfessionalChristianity:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: DomainKit
      - package: Supabase
        product: Supabase
      - target: ConfessionalChristianityWidgetExtension
        embed: true
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: Confessional Christianity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Lord's Day capture (TKL-860): photographing sermon notes.
        NSCameraUsageDescription: Photograph your handwritten sermon notes so the app can turn them into cards for the week. Photos are kept on your iPhone, sent only to draft the cards, and not stored online.
        NSPhotoLibraryUsageDescription: Choose a photo of your sermon notes you already took, to turn it into cards for the week.
        # Read by SupabaseConfig.swift. Values are the website's
        # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        # (public by design; the service role key never ships in the app).
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        # Lord's Day loop counts (TKL-947), read by LoopAnalytics. PostHog's
        # project capture key is write-only and public by design (the same key
        # the website's NEXT_PUBLIC_POSTHOG_KEY holds); it can't read anything.
        PostHogKey: $(POSTHOG_KEY)
        PostHogHost: $(POSTHOG_HOST)
        UIAppFonts:
          - Cinzel-Regular.ttf
          - Cinzel-SemiBold.ttf
          - Marcellus-Regular.ttf
    entitlements:
      path: Sources/ConfessionalChristianity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.confessionalchristianity.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confessionalchristianity.app
        SUPABASE_URL: https://vzxoypketuxmomsbyspy.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_QDtg2bLu0MSTGaA_5hN7xw_QFSwo3UM
        POSTHOG_KEY: phc_dF6Jl6RuY7mAZpIA2zAp84Ji1L9oikmKdPUQJBaBsJq
        POSTHOG_HOST: https://us.i.posthog.com
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Sources/ConfessionalChristianity.entitlements
        DEVELOPMENT_TEAM: 7GZKY29XJH
        CODE_SIGN_STYLE: Automatic
    schemes:
      ConfessionalChristianity:
        build:
          targets:
            ConfessionalChristianity: all
            ConfessionalChristianityWidgetExtension: all
        run:
          config: Debug
        test:
          config: Debug
          targets:
            - ConfessionalChristianityUITests

  # TKL-947: taps the real Lord's Day screens so the loop's events go out from
  # a simulator. Not part of `build`; run with `xcodebuild test` (see CLAUDE.md).
  ConfessionalChristianityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ConfessionalChristianity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confessionalchristianity.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 7GZKY29XJH
        CODE_SIGN_STYLE: Automatic

  # A Home Screen widget previewing the visitor's active catechism session
  # (current question, progress) — reads the same App Group-backed SwiftData
  # store as the app (see DomainKit's makeSharedModelContainer), entirely
  # offline. Nice-to-have per the plan: a cheap, reviewer-visible native
  # surface beyond the tab UI, helping the Guideline 4.2 (minimum
  # functionality) case.
  ConfessionalChristianityWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Sources/DesignSystem.swift
      - path: Sources/Fonts
    dependencies:
      - package: DomainKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Confessional Christianity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Cinzel-Regular.ttf
          - Cinzel-SemiBold.ttf
          - Marcellus-Regular.ttf
    entitlements:
      path: Widget/ConfessionalChristianityWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.confessionalchristianity.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.confessionalchristianity.app.widget
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: Widget/ConfessionalChristianityWidgetExtension.entitlements
        DEVELOPMENT_TEAM: 7GZKY29XJH
        CODE_SIGN_STYLE: Automatic
