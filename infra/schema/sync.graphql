input SyncChangeInput {
  id: ID!
  table: String!
  row_id: ID!
  child_id: ID!
  updated_at: AWSDateTime!
  deleted_at: AWSDateTime
  payload: String
}

type SyncRecord {
  table: String!
  id: ID!
  child_id: ID!
  updated_at: AWSDateTime!
  deleted_at: AWSDateTime
  payload: String
  change_id: String!
}

enum SyncPushStatus {
  ACCEPTED
  REJECTED
  RETRY
}

enum SyncPushReason {
  UNAUTHORIZED
  INVALID_INPUT
  CLOCK_SKEW
  CONTENTION
}

type SyncPushResult {
  id: ID!
  status: SyncPushStatus!
  reason: SyncPushReason
}

type Query {
  pullSync(table: String!, after: String = "0", limit: Int = 50): [SyncRecord!]!
}

type Mutation {
  pushSync(changes: [SyncChangeInput!]!): [SyncPushResult!]!
}
